# Netlify build config for Beyond the Arc.
#
# The data pipeline (`npm run sync:* + npm run export:data`) runs LOCALLY
# against Supabase + CBB Analytics and writes pre-built JSON into public/data.
# Those files are committed to the repo, so Netlify only needs to run the
# framework build to turn React + JSON into HTML.

[build]
  # Production deploys are MANUAL from a local machine: run
  # `node scripts/build-with-r2-stash.mjs` then
  # `netlify deploy --prod --dir=out`. Netlify's hosted build runner
  # times out on this project's ~23k static pages even after
  # optimization — local builds (no cap) are the only reliable path.
  #
  # We still keep the build command set in case someone manually
  # triggers a deploy from the dashboard, but the `ignore` rule below
  # skips Netlify's automatic build on push so failing CI doesn't burn
  # build minutes.
  command   = "node scripts/build-with-r2-stash.mjs"
  publish   = "out"
  # Exit 0 = "no changes worth deploying" = Netlify skips the build.
  # Auto-deploys on git push become no-ops; the live site stays on the
  # last manual `netlify deploy --prod` snapshot. To re-enable auto-
  # deploys, change this to `exit 1` (or remove the line) and pray the
  # 18-min build cap holds.
  ignore    = "exit 0"

# Serverless functions ship alongside the static export. The site itself is
# `output: "export"` with no server, so this is the only place server-side
# secrets (ANTHROPIC_API_KEY) can live — they are never bundled into the client.
# Canonical host. The site answered 200 on BOTH btacbb.xyz and
# beyond-the-arc.netlify.app — Netlify keeps the generated subdomain serving
# even after a custom domain is set, and does not 301 it by default. Two live
# copies of 30,000 pages is a duplicate-content split, and robots.txt was
# making it worse by naming the subdomain as Host.
#
# `force = true` is required: without it a redirect loses to an existing file,
# and every one of these paths exists in the export.
#
# Deploy previews are unaffected — they are served from
# deploy-preview-<n>--beyond-the-arc.netlify.app, which does not match this
# `from` host.
[[redirects]]
  from   = "https://beyond-the-arc.netlify.app/*"
  to     = "https://btacbb.xyz/:splat"
  status = 301
  force  = true

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  # The paid seasons travel INSIDE the function bundle, not in `out/`.
  # Netlify publishes `out/` as the website and would serve anything in it to
  # anyone; included_files puts these on the function's own filesystem, where
  # no URL reaches them. scripts/stage-gated-data.mjs writes this directory
  # during the build and deletes the same files from out/ — see that script
  # for why both halves are required.
  #
  # Harmless when the paywall is off: the directory is empty and the glob
  # simply matches nothing.
  included_files = ["gated-data/**"]

# A readable path for the gated-season endpoint. status 200 is a rewrite
# rather than a redirect, so the browser's Authorization header survives —
# a 30x would drop it and every subscriber would look signed out.
[[redirects]]
  from   = "/api/season/*"
  to     = "/.netlify/functions/season/:splat"
  status = 200

# THIS BLOCK NO LONGER DRIVES `npm run dev`. It is kept only for
# `npm run dev:netlify`, an escape hatch for reproducing Netlify's own routing.
#
# `npm run dev` now starts the three processes itself (next dev :3000,
# `netlify functions:serve` :9999, and scripts/dev-proxy.mjs :8899) because the
# Netlify CLI's dev proxy leaks ~16-28 MB per proxied response until V8 aborts,
# and well before that starts silently dropping client-side navigations — see
# the header of scripts/dev.mjs for the measurements. Our proxy holds nothing:
# 75 -> 88 -> 87 MB across 240 requests, against 131 -> 4,988 MB across 20.
#
# If you do run dev:netlify, the heap flag below stays on the Next child rather
# than in NODE_OPTIONS: every node process in the tree inherits NODE_OPTIONS, so
# setting it there hands the CLI proxy's leak an 8 GB rope, which defers the
# crash rather than preventing it.
[dev]
  command = "node --max-old-space-size=8192 ./node_modules/next/dist/bin/next dev"
  framework = "#custom"
  targetPort = 3000
  # Not Netlify's default 8888 — a system service (ipfsvc) already listens
  # there on this machine and can't be evicted, so the dev proxy never binds.
  port = 8899
  autoLaunch = false

[build.environment]
  NODE_VERSION = "20"
  # Skip Next telemetry to keep build logs clean
  NEXT_TELEMETRY_DISABLED = "1"

# Long-term cache the immutable Next.js asset bundles. The hashed filenames
# already bust the cache on any change.
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Photos + brand art: long cache, but NOT immutable.
#
# These are stable, human-meaningful names (/images/players/<bartId>.webp, the
# nav logos) whose CONTENT can change — a corrected headshot, a logo tweak.
# `immutable` promises the opposite and tells the browser not to revalidate even
# on an ordinary reload, so anyone who loaded the site once would keep the old
# art for a year with no way to recover. Only content-hashed names may claim
# immutable, which is why /_next/static/* above still does.
#
# Verified against btacbb.xyz that Netlify's `*` DOES span path segments, so
# this one rule covers the ~20k files under /images/players/ as well as the
# top-level brand art — no second rule needed, and no reliance on which of two
# overlapping rules would win.
#
# Perceived speed is unchanged: within a session everything is a cache hit, and
# past the week stale-while-revalidate hands over the cached copy immediately
# while refreshing in the background, so a returning reader never waits on the
# network. Replacing art now propagates in about a week instead of never.
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=2592000"

# JSON data files change on each export — let edges revalidate.
[[headers]]
  for = "/data/*.json"
  [headers.values]
    Cache-Control = "public, max-age=600, stale-while-revalidate=86400"

# Per-player + per-team JSONs (sharded under /data/...) follow the same rule.
[[headers]]
  for = "/data/*/*.json"
  [headers.values]
    Cache-Control = "public, max-age=600, stale-while-revalidate=86400"

# ---------------------------------------------------------------------------
# PHOTOGRAPHS — keep-and-mitigate, decided 2026-09-02. See
# docs/TODO-legal-sources.md §2 for the risk analysis behind these two rules.
# ---------------------------------------------------------------------------

# Keep headshots out of the image indexes.
#
# These are ESPN-sourced, and the copyright sits with ~360 athletics
# departments rather than with us. Google Images and reverse-image search are
# the one DISCOVERY path here that runs without a human deciding to look, so
# closing it is the cheapest risk reduction available — and it is good practice
# regardless: a wall of headshots competing in image search brings no readers to
# a site whose value is numbers.
#
# X-Robots-Tag is the only mechanism that works on a binary file. `noindex` in a
# <meta> tag needs an HTML document, and robots.txt only asks a crawler not to
# FETCH — it cannot stop a URL it already knows about from being indexed. This
# header is a directive on the asset itself and applies to every crawler that
# honours it.
#
# Merges with the /images/* Cache-Control rule above rather than replacing it:
# Netlify applies every matching rule, and these set a header that one does not.
[[headers]]
  for = "/images/players/*"
  [headers.values]
    X-Robots-Tag = "noindex"

# Same for the coaches. Nothing renders these today — coach-photo.tsx has
# SHOW_PHOTOS = false — but the files are still published and still fetchable at
# their own URLs, so the header belongs here for as long as they ship.
[[headers]]
  for = "/images/coaches/*"
  [headers.values]
    X-Robots-Tag = "noindex"

# ---------------------------------------------------------------------------
# THE KILL SWITCH. Uncomment both blocks to take every photograph off the live
# site, then deploy. Leave everything else alone.
#
# WHY IT LIVES HERE AND NOT IN THE COMPONENTS. The components have a build-time
# flag too (NEXT_PUBLIC_BTA_PHOTOS=off), and that is the right permanent answer
# — but it costs a full rebuild of ~23k pages plus an upload, which is the best
# part of two hours. Config is the fast path: `out/` does not change, Netlify
# re-uploads nothing, and the photos are gone in minutes. Use this to comply
# NOW, then rebuild with the flag at leisure.
#
# `force = true` is REQUIRED. Without it a redirect loses to an existing file,
# and all ~20k of these exist in the export — the rule would match nothing.
#
# The pages do not break. Both photo components fall back to an initials
# monogram on the image's error event, so a 404 degrades every avatar on the
# site automatically. That fallback is shipped and working today; it is what
# every player without a headshot already renders.
#
# RUNBOOK on a takedown notice: uncomment → `netlify deploy --prod --dir=out
# --no-build` → confirm the deploy reaches `ready` → reply to the sender saying
# it is done. Responding fast and in good faith is the single behaviour that
# keeps a notice from becoming anything more than a notice.
# ---------------------------------------------------------------------------

# [[redirects]]
#   from   = "/images/players/*"
#   to     = "/404.html"
#   status = 404
#   force  = true

# [[redirects]]
#   from   = "/images/coaches/*"
#   to     = "/404.html"
#   status = 404
#   force  = true
